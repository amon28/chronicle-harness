name: Shell scripts

# src/toolkit/job, doctor and toolkit-pull run in the app's Alpine busybox, not in bash. The unit tests
# check what the app sends them; this runs them for real, on busybox, in about ten seconds - so a
# busybox-only surprise (a flag, an applet, an exit code) fails here instead of on a phone.

on:
  push:
    paths:
      - 'src/toolkit/**'
      - '.github/workflows/shell-scripts.yml'
  pull_request:
    paths:
      - 'src/toolkit/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  busybox:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run the three scripts under real busybox
        run: |
          docker run --rm -e DOCTOR_HOSTS=dl-cdn.alpinelinux.org -v "$PWD:/work" -w /work alpine:3.22 sh -eu -c '
            echo "--- install the way the app does (cp + chmod, no bash) ---"
            for f in job doctor toolkit-pull; do
              cp "src/toolkit/$f" "/usr/local/bin/$f"
              chmod 755 "/usr/local/bin/$f"
            done
            ( cd /usr/local/bin && sha256sum job doctor toolkit-pull > .toolkit )
            cat /usr/local/bin/.toolkit

            echo "--- job: a handle while the command is still running ---"
            id=$(job run "sleep 3; echo ok")
            [ -n "$id" ] || { echo "no handle came back"; exit 1; }
            job out "$id" 20 | tee /tmp/o1
            grep -q RUNNING /tmp/o1
            job wait "$id" 15 | tee /tmp/o2
            grep -q "DONE exit=0" /tmp/o2
            grep -qx ok /tmp/o2
            job list | grep -q "$id"
            job rm "$id" | grep -q forgotten

            echo "--- job: a failure is reported as a failure, not as ok ---"
            id2=$(job run "echo boom; exit 7")
            job wait "$id2" 10 | tee /tmp/o3
            grep -q "DONE exit=7" /tmp/o3
            job rm "$id2" >/dev/null

            echo "--- doctor: says what is missing before a task needs it ---"
            doctor | tee /tmp/doc
            grep -q "^kernel" /tmp/doc
            grep -Eq "^ffmpeg +MISSING" /tmp/doc
            grep -q "writable" /tmp/doc
            grep -Eq "^net +dl-cdn\.alpinelinux\.org +ok" /tmp/doc

            echo "--- toolkit-pull: verifies, and catches a hand-edited copy ---"
            toolkit-pull | tee /tmp/pull
            grep -Eq "^job +ok" /tmp/pull
            printf "\n# junk\n" >> /usr/local/bin/job
            toolkit-pull | tee /tmp/pull2
            grep -Eq "^job +DRIFT" /tmp/pull2
            cp src/toolkit/job /usr/local/bin/job && chmod 755 /usr/local/bin/job
            toolkit-pull | grep -Eq "^job +ok"

            echo "--- toolkit-pull: a correct hash on a file nobody can run is not ok ---"
            chmod 644 /usr/local/bin/job
            toolkit-pull | tee /tmp/pull3
            grep -Eq "^job +NOT-EXECUTABLE" /tmp/pull3
            chmod 755 /usr/local/bin/job
            toolkit-pull | grep -Eq "^job +ok"

            echo "--- toolkit-pull from a URL: the manifest header is a comment, not a script ---"
            apk add --no-cache curl >/dev/null
            rm -rf /tmp/urlsrc && mkdir -p /tmp/urlsrc
            cp src/toolkit/job src/toolkit/doctor src/toolkit/toolkit-pull /tmp/urlsrc/
            {
              echo "# generated by the app (toolkit v1) - do not edit"
              ( cd /tmp/urlsrc && sha256sum job doctor toolkit-pull )
            } > /usr/local/bin/.toolkit
            if ! TOOLKIT_URL=file:///tmp/urlsrc toolkit-pull > /tmp/pull4 2>&1; then
              cat /tmp/pull4; echo "a pull from a URL failed"; exit 1
            fi
            cat /tmp/pull4
            ! grep -q generated /tmp/pull4
            [ ! -e /usr/local/bin/generated ] || { echo "the manifest header was pulled as a script"; exit 1; }
            grep -Eq "^job +ok" /tmp/pull4
            grep -Eq "^toolkit-pull +ok" /tmp/pull4

            echo "--- toolkit-pull: a malformed manifest line is reported, not pulled, and fails the run ---"
            printf "README.md %s\n" "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" >> /usr/local/bin/.toolkit
            if TOOLKIT_URL=file:///tmp/urlsrc toolkit-pull > /tmp/pull5 2>&1; then
              echo "a malformed manifest line did not fail the pull"; cat /tmp/pull5; exit 1
            fi
            cat /tmp/pull5
            grep -q "bad manifest line 5: README.md" /tmp/pull5
            ! grep -q "pull  README.md" /tmp/pull5
            [ ! -e /usr/local/bin/README.md ] || { echo "a bad manifest line was pulled as a script"; exit 1; }
            # back to the manifest the app would have left, for anything that follows
            ( cd /usr/local/bin && sha256sum job doctor toolkit-pull > .toolkit )
            rm -rf /tmp/urlsrc
            echo "--- toolkit-pull: a skill scripts/ folder listed in .toolkit-url reaches PATH ---"
            mkdir -p /tmp/skill
            printf "#!/bin/sh\r\necho hello-from-skill\r\n" > /tmp/skill/st-hello
            sh_=$(printf "#!/bin/sh\necho hello-from-skill\n" | sha256sum | cut -d" " -f1)
            printf "# toolkit source for the skill ci\n%s  st-hello\n" "$sh_" > /tmp/skill/.toolkit
            printf "# toolkit sources\nfile:///tmp/skill\n" > /tmp/urls
            TOOLKIT_URLS_FILE=/tmp/urls toolkit-pull | tee /tmp/pull6
            grep -Eq "^st-hello +ok" /tmp/pull6
            st-hello | grep -qx hello-from-skill
            printf "#!/bin/sh\necho evil\n" > /tmp/skill/st-hello
            if TOOLKIT_URLS_FILE=/tmp/urls toolkit-pull > /tmp/pull7 2>&1; then echo "a tampered skill script was accepted"; exit 1; fi
            grep -q "st-hello SKIPPED (checksum mismatch" /tmp/pull7
            st-hello | grep -qx hello-from-skill

            echo "--- all three scripts ran on busybox ---"
          '
